# Minimal check so auto-merge can wait for a green status (optional if branch protection requires checks).
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repository sanity check
        run: test -f README.md
