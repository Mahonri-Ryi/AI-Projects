name: Deploy Little Dream (baby-sleep)

on:
  push:
    branches: [main]
    paths:
      - 'baby-sleep/**'
      - '.github/workflows/deploy-baby-sleep.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-baby-sleep
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: baby-sleep/package-lock.json
      - name: Install and build
        working-directory: baby-sleep
        env:
          GITHUB_PAGES: 'true'
        run: |
          npm ci
          npm run build
      - name: Prepare site (app lives at /baby-sleep/ on Pages)
        run: |
          mkdir -p _site/baby-sleep
          cp -r baby-sleep/dist/* _site/baby-sleep/
          cat > _site/index.html <<'EOF'
          <!DOCTYPE html>
          <html lang="en">
            <head>
              <meta charset="UTF-8" />
              <meta http-equiv="refresh" content="0; url=baby-sleep/" />
              <title>AI-Projects</title>
            </head>
            <body>
              <p><a href="baby-sleep/">Little Dream — Baby Sleep Tracker</a></p>
            </body>
          </html>
          EOF
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
