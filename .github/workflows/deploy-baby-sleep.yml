name: Deploy Little Dream (baby-sleep)

on:
  push:
    branches: [main]
    paths:
      - 'baby-sleep/**'
      - '.github/workflows/deploy-baby-sleep.yml'
  workflow_dispatch:

# Deploy to gh-pages branch (works with Settings → Pages → Deploy from branch)
permissions:
  contents: write

concurrency:
  group: pages-baby-sleep
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: baby-sleep/package-lock.json

      - name: Install and build
        working-directory: baby-sleep
        env:
          GITHUB_PAGES: 'true'
        run: |
          npm ci
          npm run build

      - name: Prepare site (app at /AI-Projects/baby-sleep/)
        run: |
          mkdir -p _site/baby-sleep
          cp -r baby-sleep/dist/* _site/baby-sleep/
          touch _site/.nojekyll
          cat > _site/index.html <<'EOF'
          <!DOCTYPE html>
          <html lang="en">
            <head>
              <meta charset="UTF-8" />
              <meta http-equiv="refresh" content="0; url=baby-sleep/" />
              <title>AI-Projects</title>
            </head>
            <body>
              <p><a href="baby-sleep/">Little Dream — Baby Sleep Tracker</a></p>
            </body>
          </html>
          EOF

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          publish_branch: gh-pages
          force_orphan: true
